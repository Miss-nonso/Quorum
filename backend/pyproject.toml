[project]
name = "conductor"
version = "0.1.0"
description = "A distributed job scheduling and workflow engine built on PostgreSQL."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
conductor = "conductor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "N",             # naming
  "S",             # bandit (security)
  "ASYNC",         # async pitfalls
  "SIM",           # simplifications
  "PT",            # pytest style
  "RUF",
]
# `random` is used only for backoff jitter and failure simulation, never for secrets.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]           # assert is the point of a test
"alembic/versions/**" = ["N999"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["conductor"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a real PostgreSQL (see TEST_DATABASE_URL)",
  "chaos: spawns real worker processes and kills them",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["conductor"]
branch = true
# Chaos tests run real `conductor worker` processes; measure those too.
# (SIGKILLed processes write no data, so their share is undercounted, not faked.)
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
