name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pull requests: one group per PR, so a new push cancels the superseded run.
  # Everything else (main): one group per commit and never cancelled, so every
  # commit keeps a complete result and re-running an old one can't cancel a newer one.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  backend-lint:
    name: Backend · lint & types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy tests

  backend-test:
    name: Backend · tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quorum
          POSTGRES_PASSWORD: quorum
          POSTGRES_DB: quorum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quorum -d quorum"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://quorum:quorum@localhost:5432/quorum
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked
      - name: Unit, integration and chaos tests
        run: uv run pytest --cov --cov-report=term
      - name: Coverage gate (domain, worker, scheduler, store >= 85%)
        run: >-
          uv run coverage report --fail-under=85
          --include='src/quorum/domain/*,src/quorum/worker/*,src/quorum/scheduler/*,src/quorum/store/*'

  frontend:
    name: Dashboard · lint, types, tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end (Playwright + axe)
    runs-on: ubuntu-24.04
    needs: [backend-test, frontend]
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quorum
          POSTGRES_PASSWORD: quorum
          POSTGRES_DB: quorum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quorum -d quorum"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      QUORUM_DATABASE_URL: postgresql+asyncpg://quorum:quorum@localhost:5432/quorum
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  compose:
    name: Compose files and dashboard image
    runs-on: ubuntu-24.04
    defaults:
      run:
        # The workflow default is `backend`; these paths are relative to the repo root.
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          POSTGRES_PASSWORD=x DASHBOARD_ORIGIN=https://x API_DOMAIN=api.x ACME_EMAIL=a@x \
            docker compose -f deploy/docker-compose.prod.yml config -q
      - name: Validate Caddyfile
        run: |
          docker run --rm -e API_DOMAIN=api.example.com -e ACME_EMAIL=a@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: quorum-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  backend-image:
    name: Backend · image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: quorum-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
