name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  backend-lint:
    name: Backend · lint & types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy tests

  backend-test:
    name: Backend · tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conductor
          POSTGRES_PASSWORD: conductor
          POSTGRES_DB: conductor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U conductor -d conductor"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://conductor:conductor@localhost:5432/conductor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked
      - name: Unit, integration and chaos tests
        run: uv run pytest --cov --cov-report=term
      - name: Coverage gate (domain, worker, scheduler, store >= 85%)
        run: >-
          uv run coverage report --fail-under=85
          --include='src/conductor/domain/*,src/conductor/worker/*,src/conductor/scheduler/*,src/conductor/store/*'

  backend-image:
    name: Backend · image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: conductor-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
