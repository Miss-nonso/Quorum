# Production: one small VPS (2 vCPU / 2-4 GB), behind Caddy with automatic TLS.
# The dashboard is served by Vercel. See docs/deployment.md for the runbook.
#
#   cp deploy/.env.prod.example deploy/.env      # then fill in real values
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#
# Secrets come only from the environment file (never committed).
name: conductor

x-backend: &backend
  image: ${CONDUCTOR_IMAGE:-ghcr.io/OWNER/conductor-backend:latest}
  restart: unless-stopped
  environment: &backend-env
    CONDUCTOR_ENV: production
    CONDUCTOR_DATABASE_URL: postgresql+asyncpg://conductor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/conductor
    CONDUCTOR_LOG_FORMAT: json
    CONDUCTOR_LOG_LEVEL: ${CONDUCTOR_LOG_LEVEL:-INFO}
    CONDUCTOR_DEMO_MODE: "true"
    CONDUCTOR_DEMO_DATASET_URL: http://api:8000/api/v1/demo/dataset
    CONDUCTOR_HTTP_ALLOWLIST: api
    CONDUCTOR_CORS_ORIGINS: ${DASHBOARD_ORIGIN:?set DASHBOARD_ORIGIN, e.g. https://conductor.example.com}
    CONDUCTOR_LEASE_TTL_S: "6"
    CONDUCTOR_HEARTBEAT_INTERVAL_S: "1"
    CONDUCTOR_REAPER_INTERVAL_S: "1"
    CONDUCTOR_WORKER_UNHEALTHY_AFTER_S: "3"
    CONDUCTOR_WORKER_DEAD_AFTER_S: "8"
    CONDUCTOR_DEMO_RETENTION_S: "1800"
    CONDUCTOR_DEMO_RESET_INTERVAL_S: "300"
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: conductor
    # No published port: only services on this network can reach the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d conductor"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources: { limits: { memory: 768M } }

  migrate:
    <<: *backend
    command: ["conductor", "migrate"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on: { db: { condition: service_healthy } }

  seed:
    <<: *backend
    command: ["conductor", "seed"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on: { migrate: { condition: service_completed_successfully } }

  api:
    <<: *backend
    command: ["conductor", "api"]
    environment:
      <<: *backend-env
      # Trust X-Forwarded-For only because the API is reachable solely through Caddy.
      FORWARDED_ALLOW_IPS: "*"
    depends_on: { seed: { condition: service_completed_successfully } }
    deploy:
      resources: { limits: { memory: 384M } }

  # Two schedulers: one leads (advisory lock), the other takes over if it dies.
  scheduler:
    <<: *backend
    command: ["conductor", "scheduler"]
    healthcheck: { disable: true }
    depends_on: { migrate: { condition: service_completed_successfully } }
    deploy:
      replicas: 2
      resources: { limits: { memory: 192M } }

  # The demo pool: chaos-enabled, restarted after every "kill a worker".
  worker:
    <<: *backend
    command: ["conductor", "worker"]
    environment:
      <<: *backend-env
      CONDUCTOR_DEMO_CHAOS: "true"
      CONDUCTOR_WORKER_CONCURRENCY: "4"
    healthcheck: { disable: true }
    stop_grace_period: 30s
    depends_on: { migrate: { condition: service_completed_successfully } }
    deploy:
      replicas: 3
      resources: { limits: { memory: 192M } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN, e.g. api.conductor.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
